[package]
name = "plurid_delog"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
description = "Centralized logging client for self-hosted Delog"
repository = "https://github.com/plurid/delog"
license-file = "LICENSE"
readme = "README.md"

[dependencies]
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[dev-dependencies]
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
