name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  workspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.14'
      - run: rustup toolchain install stable --profile minimal
      - run: rustup default stable
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm verify
      - run: python -m pip wheel --no-deps --wheel-dir /tmp/delog-wheels ./packages/delog-client/delog-python
      - run: cargo package --locked --allow-dirty --manifest-path packages/delog-client/delog-rust/Cargo.toml
      - run: docker build --tag delog:verify .
